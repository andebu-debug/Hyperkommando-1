<script>
'use strict';
/* =====================================================================
   HYPERKOMMANDO 1: OPERATION STÅLFÅGEL  ·  Wåle production 2026
   Endre navnet på spillet her:
   ===================================================================== */
const GAME_TITLE = ['HYPERKOMMANDO 1', 'OPERATION STÅLFÅGEL'];

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { } }

const coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches;
let touchMode = coarse;
const settings = Object.assign({ music: true, sfx: true, quality: coarse ? 0 : 1, sens: 1 }, lsGet('kk_settings', {}));
function saveSettings() { lsSet('kk_settings', settings); }

/* ===================== AUDIO ===================== */
let AC = null, master, musicBus, sfxBus, guitarIn, noiseBuf;
const T = () => AC.currentTime;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4; comp.connect(AC.destination);
  master = AC.createGain(); master.gain.value = 0.9; master.connect(comp);
  musicBus = AC.createGain(); musicBus.gain.value = settings.music ? 0.3 : 0; musicBus.connect(master);
  sfxBus = AC.createGain(); sfxBus.gain.value = settings.sfx ? 0.75 : 0; sfxBus.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // distorted guitar bus
  const ws = AC.createWaveShaper(); const n = 1024, curve = new Float32Array(n), k = 40;
  for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; curve[i] = (1 + k) * x / (1 + k * Math.abs(x)); }
  ws.curve = curve; const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
  const gg = AC.createGain(); gg.gain.value = 0.32; ws.connect(lp); lp.connect(gg); gg.connect(musicBus); guitarIn = ws;
  MUSIC.next = AC.currentTime + 0.1;
  setInterval(musicTick, 25);
}
function applyAudio() { if (!AC) return; musicBus.gain.setTargetAtTime(settings.music ? 0.3 : 0, T(), 0.05); sfxBus.gain.setTargetAtTime(settings.sfx ? 0.75 : 0, T(), 0.05); }
function tone(type, f0, f1, dur, vol, at, bus) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, at); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), at + dur);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(bus || sfxBus); o.start(at); o.stop(at + dur + 0.03);
}
function noise(dur, vol, ft, f0, f1, at, bus, q) {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = ft; f.Q.value = q || 1; f.frequency.setValueAtTime(f0, at); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), at + dur);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(bus || sfxBus); s.start(at, Math.random()); s.stop(at + dur + 0.03);
}
const SFX = {
  punch() { const t = T(); noise(.12, .6, 'lowpass', 900, 200, t); tone('sine', 160, 50, .14, .7, t); },
  pistol() { const t = T(); noise(.13, .55, 'bandpass', 2800, 500, t); tone('square', 300, 70, .1, .25, t); },
  shotgun() { const t = T(); noise(.35, .9, 'lowpass', 4000, 250, t); tone('sine', 130, 40, .3, .7, t); noise(.05, .3, 'highpass', 3000, 3000, t + .38); noise(.06, .3, 'highpass', 2500, 2500, t + .5); },
  chain() { const t = T(); noise(.08, .45, 'bandpass', 2400, 700, t); tone('square', 200, 90, .06, .18, t); },
  rocket() { const t = T(); noise(.6, .55, 'bandpass', 900, 180, t, null, 2); tone('sawtooth', 220, 60, .45, .25, t); },
  plasma() { const t = T(); tone('square', 1100, 300, .12, .18, t); tone('sine', 2200, 700, .1, .12, t); },
  mega() { const t = T(); tone('sawtooth', 80, 900, .7, .35, t); tone('square', 40, 600, .7, .2, t); noise(.8, .4, 'bandpass', 300, 3000, t); },
  boom() { const t = T(); noise(1.1, 1, 'lowpass', 1500, 60, t); tone('sine', 90, 25, .9, .9, t); },
  empty() { const t = T(); noise(.04, .3, 'highpass', 4000, 4000, t); },
  pick() { const t = T(); [660, 880, 1320].forEach((f, i) => tone('triangle', f, f, .09, .25, t + i * .05)); },
  power() { const t = T(); [523, 659, 784, 1046, 1318].forEach((f, i) => tone('square', f, f, .12, .14, t + i * .06)); },
  weapon() { const t = T(); [330, 440, 554, 660].forEach((f, i) => { tone('sawtooth', f, f, .25, .14, t + i * .07); tone('sawtooth', f * 1.5, f * 1.5, .25, .08, t + i * .07); }); },
  kreatin() { const t = T(); tone('sawtooth', 110, 440, .6, .3, t); tone('sawtooth', 165, 660, .6, .2, t); [880, 1100, 1320].forEach((f, i) => tone('square', f, f, .15, .12, t + .5 + i * .08)); },
  hurt() { const t = T(); tone('sawtooth', 320, 90, .22, .35, t); noise(.15, .3, 'lowpass', 1200, 300, t); },
  claw() { const t = T(); noise(.12, .4, 'highpass', 2000, 600, t); },
  e_bullet() { const t = T(); tone('square', 700, 200, .1, .12, t); noise(.06, .2, 'bandpass', 2000, 800, t); },
  e_laser() { const t = T(); tone('sine', 1600, 300, .15, .14, t); },
  e_fire() { const t = T(); noise(.35, .3, 'bandpass', 600, 200, t, null, 3); tone('triangle', 200, 80, .3, .15, t); },
  e_erocket() { SFX.rocket(); },
  e_eorb() { const t = T(); tone('sine', 300, 90, .6, .3, t); tone('square', 150, 45, .6, .1, t); },
  edie() { const t = T(); tone('square', 500, 40, .35, .22, t); noise(.3, .4, 'bandpass', 1500, 200, t, null, 2); },
  alert() { const t = T(); tone('sawtooth', 180, 340, .18, .12, t); },
  roar() { const t = T(); tone('sawtooth', 70, 45, 1.4, .5, t); tone('sawtooth', 73, 40, 1.4, .4, t); noise(1.4, .5, 'lowpass', 600, 100, t); },
  portal() { const t = T(); tone('sine', 200, 1600, .9, .3, t); [523, 784, 1046, 1568].forEach((f, i) => tone('triangle', f, f, .2, .15, t + .3 + i * .08)); },
  die() { const t = T(); tone('sawtooth', 400, 40, 1.2, .4, t); noise(1, .4, 'lowpass', 2000, 100, t); },
  flame() { const t = T(); noise(.12, .35, 'bandpass', 900 + Math.random() * 400, 300, t, null, .7); },
  throw() { const t = T(); noise(.15, .25, 'bandpass', 1200, 400, t, null, 2); },
  clink() { const t = T(); tone('triangle', 1800, 1500, .06, .12, t); },
  burn() { const t = T(); noise(.2, .2, 'lowpass', 1500, 400, t); },
  whine() { const t = T(); tone('sine', 900, 400, .5, .2, t); tone('sine', 700, 300, .4, .15, t + .45); },
  woof() { const t = T(); noise(.1, .55, 'bandpass', 500, 300, t, null, 3); tone('sawtooth', 180, 120, .1, .15, t); },
  jump() { const t = T(); tone('sine', 260, 520, .14, .18, t); },

/* ===================== LEVEL GEN ===================== */
function genLevel(n, d) {
  const r = mulberry32(n * 9973 + 77), R = (a, b) => a + Math.floor(r() * (b - a + 1));
  const th = THEMES[Math.min(3, (n - 1) / 5 | 0)], isBoss = n % 5 === 0;
  const W = Math.min(48, 24 + (n * 1.2 | 0)), H = W;
  const map = new Uint8Array(W * H).fill(1);
  const rooms = [];
  const carve = (x, y, w, h) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (i > 0 && j > 0 && i < W - 1 && j < H - 1) map[j * W + i] = 0; };
  const overlap = a => rooms.some(b => a.x - 2 < b.x + b.w && a.x + a.w + 2 > b.x && a.y - 2 < b.y + b.h && a.y + a.h + 2 > b.y);
  if (isBoss) rooms.push({ x: W - 16, y: H - 16, w: 14, h: 14, arena: true });
  const target = isBoss ? 6 : Math.min(14, 6 + (n / 2 | 0));
  for (let t = 0; t < 500 && rooms.length < target; t++) {
    const w = R(4, n > 8 ? 10 : 8), h = R(4, n > 8 ? 9 : 8);
    const rm = { x: R(1, W - w - 2), y: R(1, H - h - 2), w, h };
    if (!overlap(rm)) rooms.push(rm);
  }
  rooms.forEach(rm => carve(rm.x, rm.y, rm.w, rm.h));
  const cx = rm => rm.x + (rm.w >> 1), cy = rm => rm.y + (rm.h >> 1);
  const corridor = (a, b) => {
    const wd = r() < .4 ? 2 : 1; const x0 = cx(a), y0 = cy(a), x1 = cx(b), y1 = cy(b);
    const hz = (xa, xb, y) => { for (let x = Math.min(xa, xb); x <= Math.max(xa, xb); x++) carve(x, y, 1, wd); };
    const vt = (ya, yb, x) => { for (let y = Math.min(ya, yb); y <= Math.max(ya, yb); y++) carve(x, y, wd, 1); };
    if (r() < .5) { hz(x0, x1, y0); vt(y0, y1, x1); } else { vt(y0, y1, x0); hz(x0, x1, y1); }
  };
  const conn = [rooms[0]], rest = rooms.slice(1);
  while (rest.length) {
    let bi = 0, ba = conn[0], bd = 1e9;
    for (const a of conn) rest.forEach((b, i) => { const dd = Math.abs(cx(a) - cx(b)) + Math.abs(cy(a) - cy(b)); if (dd < bd) { bd = dd; bi = i; ba = a; } });
    corridor(ba, rest[bi]); conn.push(rest[bi]); rest.splice(bi, 1);
  }
  for (let k = 0; k < 2 && rooms.length > 3; k++) corridor(rooms[R(0, rooms.length - 1)], rooms[R(0, rooms.length - 1)]);
  // pillars
  rooms.forEach(rm => {
    if (rm.arena) { [[3, 3], [10, 3], [3, 10], [10, 10]].forEach(([a, b]) => { map[(rm.y + b) * W + rm.x + a] = 3; }); return; }
    if (rm.w >= 7 && rm.h >= 7 && r() < .6) for (let j = rm.y + 2; j < rm.y + rm.h - 2; j += 3) for (let i = rm.x + 2; i < rm.x + rm.w - 2; i += 3) map[j * W + i] = 2;
  });
  // wall variety
  const nearFloor = i => { const x = i % W, y = i / W | 0; return (x > 0 && map[i - 1] === 0) || (x < W - 1 && map[i + 1] === 0) || (y > 0 && map[i - W] === 0) || (y < H - 1 && map[i + W] === 0); };
  const zoneSeed = R(0, 999);
  for (let i = 0; i < W * H; i++) if (map[i] === 1) {
    const x = i % W, y = i / W | 0;
    if (((x >> 3) * 7 + (y >> 3) * 13 + zoneSeed) % 4 === 0) map[i] = 2;
    if (nearFloor(i) && r() < .07) map[i] = 3;
  }
  // BFS helper
  const bfs = (sx, sy) => { const D = new Int32Array(W * H).fill(-1), q = [sy * W + sx]; D[q[0]] = 0; for (let h = 0; h < q.length; h++) { const c = q[h]; for (const o of [1, -1, W, -W]) { const nb = c + o; if (map[nb] === 0 && D[nb] < 0) { D[nb] = D[c] + 1; q.push(nb); } } } return D; };
  while (rooms.length < 2) { const rm = { x: 2, y: 2, w: 4, h: 4 }; carve(rm.x, rm.y, rm.w, rm.h); corridor(rm, rooms[0]); rooms.push(rm); }
  let startRoom, exitRoom;
  if (isBoss) {
    exitRoom = rooms[0]; const D = bfs(cx(exitRoom), cy(exitRoom));
    startRoom = rooms.slice(1).reduce((a, b) => (D[cy(b) * W + cx(b)] > D[cy(a) * W + cx(a)] ? b : a));
  } else {
    startRoom = rooms[0]; const D = bfs(cx(startRoom), cy(startRoom));
    exitRoom = rooms.slice(1).reduce((a, b) => (D[cy(b) * W + cx(b)] > D[cy(a) * W + cx(a)] ? b : a));
  }
  if (map[cy(startRoom) * W + cx(startRoom)] !== 0) map[cy(startRoom) * W + cx(startRoom)] = 0;
  if (map[cy(exitRoom) * W + cx(exitRoom)] !== 0) map[cy(exitRoom) * W + cx(exitRoom)] = 0;
  const DS = bfs(cx(startRoom), cy(startRoom));
  const sx = cx(startRoom) + .5, sy = cy(startRoom) + .5;
  // facing
  let bestA = 0, bestL = -1;
  for (let k = 0; k < 8; k++) { const a = k * TAU / 8; let l = 0; while (l < 20 && map[((sy + Math.sin(a) * l) | 0) * W + ((sx + Math.cos(a) * l) | 0)] === 0) l += .5; if (l > bestL) { bestL = l; bestA = a; } }
  const used = new Set();
  const freeCell = (rm, minD) => {
    for (let t = 0; t < 30; t++) { const x = R(rm.x, rm.x + rm.w - 1), y = R(rm.y, rm.y + rm.h - 1), i = y * W + x; if (map[i] === 0 && !used.has(i) && DS[i] >= 0 && Math.hypot(x + .5 - sx, y + .5 - sy) > minD) { used.add(i); return [x + .5, y + .5]; } }
    return null;
  };
  used.add(cy(startRoom) * W + cx(startRoom)); used.add(cy(exitRoom) * W + cx(exitRoom));
  const ti = Math.min(3, (n - 1) / 5 | 0), k5 = (n - 1) % 5;
  const POOLS = [
    [['drone', 'drone', 'krabbe'], ['orb'], ['imp'], [], []],
    [['drone', 'pitbull', 'pitbull', 'krabbe'], ['imp'], ['tank'], ['pitbull'], []],
    [['skjelett', 'skjelett', 'skull', 'imp'], ['skull'], ['pitbull'], ['tank'], ['skjelett']],
    [['golem', 'skjelett', 'orb', 'skull'], ['golem'], ['drone', 'tank'], ['pitbull'], ['imp']]];
  const pool = []; for (let i = 0; i <= k5; i++) pool.push(...POOLS[ti][i]);
  const ens = [], pks = [];
  rooms.forEach(rm => {
    if (rm === startRoom) return;
    const cnt = Math.round((1 + r() * 2 + n * .13) * DIFFS[d].count * (rm.arena ? .5 : 1) * (DOG_LEVELS.includes(n) ? 1.45 : 1));
    for (let k = 0; k < cnt; k++) { const c = freeCell(rm, 9); if (c) ens.push({ t: pool[R(0, pool.length - 1)], x: c[0], y: c[1] }); }
    if (r() < .55) { const nb = R(1, 2); for (let k = 0; k < nb; k++) { const c = freeCell(rm, 3); if (c) ens.push({ t: 'barrel', x: c[0], y: c[1] }); } }
  });
  if (isBoss) ens.push({ t: th.boss, x: cx(exitRoom) + .5, y: cy(exitRoom) - 3 + .5 });
  // pickups
  const table = [['banana', 22], ['bar', 14], ['am_b', 16], ['am_s', 10], ['kreatin', 5], ['vest', 6], ['shake', 3], ['superv', 1]];
  if (n >= 5) table.push(['am_r', 7]); if (n >= 8) table.push(['am_c', 9]); if (n >= 2) table.push(['am_g', 7]); if (n >= 4) table.push(['am_f', 7]);
  const tot = table.reduce((s, x) => s + x[1], 0);
  const pickT = () => { let v = r() * tot; for (const [k, w] of table) { v -= w; if (v <= 0) return k; } return 'banana'; };
  rooms.forEach(rm => { const nI = R(1, 3) + (rm.arena ? 3 : 0); for (let k = 0; k < nI; k++) { const c = freeCell(rm, 1); if (c) pks.push({ t: pickT(), x: c[0], y: c[1] }); } });
  const sorted = rooms.filter(x => x !== startRoom && x !== exitRoom).sort((a, b) => DS[cy(a) * W + cx(a)] - DS[cy(b) * W + cx(b)]);
  const mid = sorted.length ? sorted[sorted.length >> 1] : exitRoom;
  if (WSCHED[n]) { const c = freeCell(mid, 1); if (c) pks.push({ t: WSCHED[n], x: c[0], y: c[1] }); }
  for (const k in WSCHED) if (+k < n && r() < .3) { const rm = sorted[R(0, Math.max(0, sorted.length - 1))] || mid; const c = freeCell(rm, 1); if (c) pks.push({ t: WSCHED[k], x: c[0], y: c[1] }); }
  if (isBoss) { for (const t of ['shake', 'superv', 'kreatin']) { const c = freeCell(startRoom, 1.5); if (c) pks.push({ t, x: c[0], y: c[1] }); } }
  return { n, th, isBoss, W, H, map, start: { x: sx, y: sy, a: bestA }, exit: { x: cx(exitRoom) + .5, y: cy(exitRoom) + .5 }, ens, pks };
}

/* ===================== INPUT ===================== */
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (state === 'crawl') { if (['Space', 'Enter', 'Escape'].includes(e.code)) { e.preventDefault(); endCrawl(); } return; }
  if (state === 'play') {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
    if (e.code.startsWith('Digit')) { const i = +e.code.slice(5) - 1; if (i >= 0 && i < NW) switchTo(i); }
    if (e.code === 'KeyG') quickGrenade();
    if (e.code === 'KeyQ') cycleWeapon(-1); if (e.code === 'KeyE') cycleWeapon(1);
    if (e.code === 'Tab') showMap = !showMap;
    if (e.code === 'Escape' || e.code === 'KeyP') pauseGame();
  } else if (state === 'pause' && (e.code === 'KeyP')) resumeGame();
  if (e.code === 'KeyM') { settings.music = !settings.music; saveSettings(); applyAudio(); syncSettings(); }
  touchMode = false;

window.addEventListener('mousemove', e => {

cv.addEventListener('contextmenu', e => e.preventDefault());
function inC(t, b) { return Math.hypot(t.clientX - b.x, t.clientY - b.y) <= b.r * 1.2; }
window.addEventListener('touchstart', e => {
  touchMode = true; initAudio(); if (state !== 'play') return; e.preventDefault();
  const L = TL();
  for (const t of e.changedTouches) {
    if (inC(t, L.pause)) { pauseGame(); return; }
    if (inC(t, L.map)) { showMap = !showMap; continue; }
    if (inC(t, L.weap)) { cycleWeapon(1); continue; }
    if (inC(t, L.jump)) { touch.jump = true; continue; }
    if (inC(t, L.fire) && !touch.fire) { touch.fire = { id: t.identifier, x: t.clientX }; continue; }
    if (t.clientX < innerWidth * .45 && !touch.joy) { touch.joy = { id: t.identifier, ox: t.clientX, oy: t.clientY, vx: 0, vy: 0 }; continue; }
    if (!touch.look) touch.look = { id: t.identifier, x: t.clientX };
  }
}, { passive: false });
window.addEventListener('touchmove', e => {
  if (state !== 'play') return; e.preventDefault();
  for (const t of e.changedTouches) {
    const j = touch.joy;
    if (j && j.id === t.identifier) { let dx = t.clientX - j.ox, dy = t.clientY - j.oy; const l = Math.hypot(dx, dy), R = 60; if (l > R) { dx *= R / l; dy *= R / l; } j.vx = dx / R; j.vy = dy / R; }
    for (const k of ['look', 'fire']) { const o = touch[k]; if (o && o.id === t.identifier) { player.a += (t.clientX - o.x) * .0065 * settings.sens; o.x = t.clientX; } }
  }
}, { passive: false });
function tEnd(e) { for (const t of e.changedTouches) for (const k of ['joy', 'look', 'fire']) if (touch[k] && touch[k].id === t.identifier) touch[k] = null; }
window.addEventListener('touchend', tEnd); window.addEventListener('touchcancel', tEnd);

/* ===================== MAIN LOOP ===================== */
let last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (t - last) / 1000); last = t; now += dt;
  if (state === 'play') update(dt);
  else if ((state === 'menu' || state === 'crawl') && player) player.a += dt * .12;
  const cur = state === 'play' ? 'none' : 'default'; if (cv.style.cursor !== cur) cv.style.cursor = cur;
  else if (state === 'end' || state === 'dead') updateFX(dt);
  if (player) render();
}
